name: Validate and deploy to Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run build
      - run: npm run test:artifact
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    permissions:
      pages: write
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: deployed-artifact

      - name: Verify live deployment smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p _site && tar -xf deployed-artifact/artifact.tar -C _site
          node tools/site-smoke.cjs
